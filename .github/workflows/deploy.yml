name: Deploy Gitea Stack

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Permet déclenchement manuel

env:
  COMPOSE_FILE: docker-compose.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Create SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        known_hosts: unnecessary

    - name: Create Docker Network
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
          docker network create web || true
        "

    - name: Copy Docker Compose & Configs
      run: |
        scp -o StrictHostKeyChecking=no ${COMPOSE_FILE} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/
        scp -o StrictHostKeyChecking=no traefik/dynamic_tls.yml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/ || true
        scp -o StrictHostKeyChecking=no traefik/certs/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/traefik/certs/ || true

    - name: Deploy Stack
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
          cd /tmp
          
          # Stop & remove ancien stack
          docker compose down || true
          
          # Deploy nouveau stack
          docker compose up -d
          
          # Logs pour vérification
          docker compose logs -f traefik gitea postgres | head -50
        "
    
    - name: Health Check
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
          sleep 30
          curl -f -L -H 'Host: git.groupe5.com' http://127.0.0.1/ || exit 1
          echo '✅ Déploiement réussi dans AWS !'
        "